name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Synthetic controller identity contract
        run: |
          metadata="$(nix flake metadata --json --no-write-lock-file .)"
          source="$(jq -r .path <<< "$metadata")"
          nar_hash="$(jq -r .locked.narHash <<< "$metadata")"
          nix eval --json --expr "let source = builtins.getFlake \"path:$source?narHash=$nar_hash\"; in import (source.outPath + \"/tests/controller-platform.nix\") { lib = source.inputs.nixpkgs.lib; }"
      - run: nix flake check
      - run: nix fmt -- --check .
      # The template is a real flake; eval it against THIS checkout's
      # engine so flakeModule/template drift fails the PR, not an adopter.
      # flake check evaluates the example host + .#mandala/.#ansibleInventory
      # without building anything heavy.
      - run: nix flake check ./templates/fleet --override-input mandala . --no-write-lock-file
      # The showcase asserts every projection's shape against this
      # checkout's engine; the terranix render is built explicitly (it's
      # a package, not a check).
      - run: nix flake check ./examples/showcase --override-input mandala . --no-write-lock-file
      - run: nix build ./examples/showcase#network-tf --override-input mandala . --no-write-lock-file
      # The Rust build runs the whole workspace suite in its check phase
      # (core/context/mcp/tui tests incl. the eval-worker spawn guard).
      - run: nix build .#mandala-rs
